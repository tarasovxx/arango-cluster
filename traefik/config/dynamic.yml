# Dynamic Traefik Configuration
# HTTPS-only access to ArangoDB cluster

http:
  middlewares:
    secure-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: false
        stsIncludeSubdomains: true
        stsSeconds: 31536000
    
    # Basic auth for Traefik dashboard
    # Default: admin / admin (change with: htpasswd -nb admin newpassword)
    traefik-auth:
      basicAuth:
        users:
          - "admin:$apr1$mfRbWWtR$Xob70KR2A6Jeg0g7Y1SOd/"

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/traefik.crt
        keyFile: /certs/traefik.key
