# Dynamic configuration for Traefik
# This file is watched and reloaded automatically

http:
  middlewares:
    # Security headers
    secure-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
    
    # Basic auth for Traefik dashboard (admin:admin - change in production!)
    # Generate new password: htpasswd -nb admin yourpassword
    traefik-auth:
      basicAuth:
        users:
          - "admin:$apr1$ruca84Hq$mbjdMZBAG.KWn7vfN/SNK/"

  # Routers
  routers:
    # Traefik dashboard (HTTP for local development)
    traefik-http:
      rule: "PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      entryPoints:
        - http
      service: api@internal
      middlewares:
        - traefik-auth

    # ArangoDB via HTTP (for local development without TLS)
    arangodb-http:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - http
      service: arangodb-local
      priority: 1

  services:
    arangodb-local:
      loadBalancer:
        servers:
          - url: "http://arango-coordinator:8529"
        passHostHeader: true
        sticky:
          cookie:
            name: arangodb_coordinator

