# Traefik Configuration - HTTPS Only with Self-Signed Certificate
# Access: https://192.168.56.11

api:
  dashboard: true
  insecure: false

log:
  level: INFO

entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
          permanent: true
  https:
    address: ":443"

# Docker Swarm provider
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    swarmMode: true
    network: arango_traefik-public
    watch: true
  file:
    directory: /config
    watch: true

# TLS configuration - use self-signed certificate
tls:
  options:
    default:
      minVersion: VersionTLS12
  certificates:
    - certFile: /certs/traefik.crt
      keyFile: /certs/traefik.key
  stores:
    default:
      defaultCertificate:
        certFile: /certs/traefik.crt
        keyFile: /certs/traefik.key
